name: Bug
description: Report something that does not work as expected
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page, role and environment. Omit passwords and customer details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Safe screenshots, logs, test results or links.
