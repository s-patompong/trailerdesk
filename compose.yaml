services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5440}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailerdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailerdesk_local}
      POSTGRES_DB: ${POSTGRES_DB:-trailerdesk}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-trailerdesk_test}
    volumes:
      - trailerdesk_pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-test.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trailerdesk} -d ${POSTGRES_DB:-trailerdesk}",
        ]
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${MAILPIT_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-18025}:8025"
      - "${MAILPIT_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-11025}:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - trailerdesk_mail:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30
volumes:
  trailerdesk_mail:
  trailerdesk_pg:
